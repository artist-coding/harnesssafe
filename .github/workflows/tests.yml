name: Offline framework checks
on: [push, pull_request]
jobs:
  framework:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/framework
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/harness_adapters tests/test_evaluation_record_v3.py tests/test_evaluation_scoring_v2.py tests/test_report_active_run.py tests/test_case_materializer.py
