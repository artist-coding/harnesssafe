<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">HarnessSafe</title>
  <desc id="desc">Reproducible safety experiments for agent harnesses. 328 frozen cases, 7 adapter integrations, one experiment workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1423"/>
      <stop offset="1" stop-color="#12283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7de8cf"/>
      <stop offset="1" stop-color="#67bfff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a3c4e2" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#background)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="439" rx="24" fill="none" stroke="#2a4154"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
